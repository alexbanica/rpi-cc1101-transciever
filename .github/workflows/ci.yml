name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Repository checks
        run: |
          python -m compileall cc1101_transceiver cc1101_connection_test.py
          python -m unittest discover -s tests -p 'test_*.py'
          bash -n run.sh
          bash -n run_cc1101_connection_test.sh
          git diff --check
      - name: Build and inspect fallback package
        run: |
          python -m build
          python -m twine check dist/*
          python -m venv /tmp/package-smoke
          /tmp/package-smoke/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/package-smoke/bin/cc1101-transceiver --help
          /tmp/package-smoke/bin/python -m cc1101_transceiver --help

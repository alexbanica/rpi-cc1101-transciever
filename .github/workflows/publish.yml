name: Publish tagged Python package
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.ref_name }}
  EVENT_COMMIT: ${{ github.sha }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify event and validate
        run: |
          test "$(git rev-parse HEAD)" = "$EVENT_COMMIT"
          python scripts/release_version.py --tag "$RELEASE_TAG"
          python -m compileall cc1101_transceiver cc1101_connection_test.py
          python -m unittest discover -s tests -p 'test_*.py'
          bash -n run.sh
          bash -n run_cc1101_connection_test.sh
          git diff --check
      - name: Build tagged pair and provenance
        run: |
          python scripts/package_artifacts.py --tag "$RELEASE_TAG" --commit "$EVENT_COMMIT" --output dist
          python -m twine check dist/*.whl dist/*.tar.gz
          python scripts/publish_forgejo.py --tag "$RELEASE_TAG" --commit "$EVENT_COMMIT" --artifacts dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-release
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-release
          path: dist
      - name: Credential-free preflight
        run: |
          test "$(git rev-parse HEAD)" = "$EVENT_COMMIT"
          python -m pip install -r requirements-dev.txt
          python scripts/publish_forgejo.py --tag "$RELEASE_TAG" --commit "$EVENT_COMMIT" --artifacts dist
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Upload validated pair
        env:
          TWINE_USERNAME: ${{ secrets.FORGEJO_PACKAGE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
          TWINE_NON_INTERACTIVE: '1'
        run: python -m twine upload --repository-url https://forgejo.alexlab.nl/api/packages/public/pypi dist/*.whl dist/*.tar.gz
